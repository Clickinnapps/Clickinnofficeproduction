<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Clickinn Office. Our website is being prepared. Please check back soon.">
  <meta name="theme-color" content="#173e35">
  <title>Clickinn Office</title>
  <style>
    :root { color-scheme: light; background: #f5f3eb; color: #173e35; font-family: Georgia, 'Times New Roman', serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    header, footer { padding: 28px clamp(24px, 6vw, 100px); }
    header { border-bottom: 1px solid #173e3526; display: flex; align-items: center; gap: 12px; }
    .mark { display: grid; place-items: center; background: #173e35; color: #f5f3eb; width: 36px; height: 36px; border-radius: 50%; font-size: 24px; }
    .brand { font-size: 20px; letter-spacing: -.5px; }
    main { flex: 1; display: grid; align-content: center; padding: 80px clamp(24px, 6vw, 100px); }
    .eyebrow, footer { font-family: 'Trebuchet MS', sans-serif; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .eyebrow { display: flex; align-items: center; gap: 10px; }
    .eyebrow::before { content: ''; height: 8px; width: 8px; background: #a2603c; border-radius: 50%; }
    h1 { font-size: clamp(56px, 9vw, 128px); font-weight: 400; line-height: 1; letter-spacing: -.055em; margin: 32px 0; max-width: 900px; }
    p { font-family: 'Trebuchet MS', sans-serif; color: #52645a; font-size: clamp(16px, 2vw, 19px); line-height: 1.7; margin: 0; max-width: 440px; }
    footer { border-top: 1px solid #173e3526; color: #52645a; letter-spacing: .06em; }
  </style>
</head>
<body>
  <header><span class="mark" aria-hidden="true">c</span><span class="brand">Clickinn Office</span></header>
  <main>
    <div class="eyebrow">Coming soon</div>
    <h1>A new space.<br>Coming together.</h1>
    <p>We’re preparing the Clickinn Office website. Please check back soon.</p>
  </main>
  <footer>Clickinn Office</footer>
</body>
</html>
