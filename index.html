<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Clickinn Office — built with AI Studio.">
    <title>Clickinn Office</title>
    <style>
      :root { color-scheme: light; background: #f4f1e9; color: #25382f; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Georgia, serif; }
      main { min-height: 100svh; max-width: 1200px; margin: auto; padding: clamp(24px, 6vw, 80px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
      .brand { font: bold 14px/1.5 Verdana, sans-serif; letter-spacing: .16em; text-transform: uppercase; border-bottom: 1px solid #9ca99e; width: 100%; padding-bottom: 24px; margin-bottom: 64px; }
      h1 { font-weight: normal; font-size: clamp(48px, 9vw, 112px); line-height: 1.05; letter-spacing: -.055em; max-width: 800px; margin: 0 0 24px; }
      p { font-size: clamp(19px, 3vw, 25px); line-height: 1.6; max-width: 620px; margin: 0 0 40px; }
      a { display: inline-block; background: #25382f; color: #f4f1e9; padding: 18px 26px; font: 14px/1.5 Verdana, sans-serif; text-decoration: none; border: 2px solid #25382f; }
      a:hover { background: #405448; }
      a:focus-visible { outline: 3px solid #9a5a2e; outline-offset: 5px; }
      footer { margin-top: 64px; font: 12px/1.7 Verdana, sans-serif; color: #56665c; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Clickinn Office</div>
      <h1>Built with<br>AI Studio</h1>
      <p>The fastest path from prompt to production with Gemini.</p>
      <a href="https://aistudio.google.com/apps">Start building &rarr;</a>
      <footer>Clickinn Office</footer>
    </main>
  </body>
</html>
